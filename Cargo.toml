[package]
name = "cosmic-ext-widgets"
version = "1.0.0"
edition = "2024"
# MPL-2.0, like libcosmic whose widget patterns this crate extends, and like
# the cosmic-pim substrate. The applications that link it are GPL-3.0-only
# and link it without absorbing it.
license = "MPL-2.0"
description = "Widgets libcosmic does not have: an animated reveal, a nav rail, and a sidebar that moves between them"
repository = "https://github.com/Magnetar-OS/cosmic-ext-widgets"
readme = "README.md"
rust-version = "1.98.1"
# Not on crates.io, and not by choice: these widgets are built on libcosmic,
# which is only published as a git repository. crates.io rejects git
# dependencies, so the only way to consume this crate is the way every COSMIC
# application consumes libcosmic itself — by git, at a tag.
publish = false

[features]
default = ["a11y"]
# Accessible names for the rail's icon-only buttons, whose label is otherwise
# only in a tooltip and so reaches nothing but the eye. On by default because
# libcosmic's own default features include `a11y`, and because the setter this
# needs — `button::name` — is itself behind that feature upstream.
a11y = ["libcosmic/a11y"]

[dependencies]
# Unpinned, like every COSMIC application: the consumer's Cargo.lock decides the
# revision, and because the source is the same URL as theirs, cargo unifies it
# with the application's own libcosmic rather than building two.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git" }
# The rail's fallback glyph is an entry's first grapheme, not its first
# `char`. Already in every libcosmic build through cosmic-text, so this adds a
# name to the manifest, not a crate to the build.
unicode-segmentation = "1.13"

[dev-dependencies]
# A software renderer for the widget-tree tests, which need a `cosmic::Renderer`
# to hand to `operate` but draw nothing. The same git source as libcosmic, so
# cargo resolves the very crate libcosmic's renderer is built from.
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic.git" }

[lints.rust]
missing_docs = "warn"

# Pedantic as warnings, not denials — the ecosystem standard. Declared here
# rather than only on the `just check` command line so that rust-analyzer
# reports the same set an editor away from the terminal.
[lints.clippy]
all = "warn"
pedantic = "warn"

# The example's sidebar wiring is the integration the README documents, so its
# tests run with the crate's own under a plain `cargo test`.
[[example]]
name = "sidebar"
test = true
