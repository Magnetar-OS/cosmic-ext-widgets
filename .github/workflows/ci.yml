# The toolchain comes from rust-toolchain.toml, which is why no version is
# named here: one file decides what the distro, the contributor and CI all
# build with.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libcosmic pulls in the system halves of the COSMIC stack; without
      # these its build scripts fail before any of this crate is compiled.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libseat-dev \
            libclang-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # The library must still build for a consumer who has turned the
      # default features off, since `a11y` is one of them.
      - name: Build without default features
        run: cargo build --lib --locked --no-default-features
